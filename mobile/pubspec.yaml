name: comercial_app
description: Aplicativo do proprietário (Android e iOS) — dashboard da plataforma de gestão comercial.
publish_to: "none"
# versionName+versionCode: o dev/build-apk.ps1 sobe o número a cada build (o app avisa quando há versão maior).
version: 1.0.10+11

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  http_parser: ^4.0.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.0
  mobile_scanner: ^7.0.1
  barcode_widget: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
